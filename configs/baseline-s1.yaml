# The second run of the compare-view demo (tracking block). Diff against
# baseline.yaml: exactly one field family (the seed). Config diff = run diff.
run_name: U0L2-baseline-s1
seed: 1
epochs: 8
data:  {dataset: cifar10, root: ./data, normalize: true, batch_size: 256}
model: {arch: resnet9, norm: batch}   # classifier => BN allowed (U0.T2 law)
opt:   {name: adamw, lr: 3.0e-4, betas: [0.9, 0.999], weight_decay: 0.01}
sched: {name: warmup_cosine, warmup_frac: 0.03}
