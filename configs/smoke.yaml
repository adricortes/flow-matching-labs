# One-epoch smoke run: the gate config for TODO C.2's --selftest-resume
# and the CPU-fallback check (throughput in the UI tells you which you got).
run_name: U0L2-smoke-s0
seed: 0
epochs: 1
data:  {dataset: cifar10, root: ./data, normalize: true, batch_size: 256}
model: {arch: resnet9, norm: batch}
opt:   {name: adamw, lr: 3.0e-4, betas: [0.9, 0.999], weight_decay: 0.01}
sched: {name: warmup_cosine, warmup_frac: 0.03}
